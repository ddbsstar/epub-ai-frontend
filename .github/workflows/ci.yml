name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    name: Container build and smoke test
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --pull --target runtime --tag epub-ai-frontend:ci .
      - name: Start without a backend
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' epub-ai-frontend:ci)" = nginx
          docker run --detach --name epub-ai-frontend-ci \
            --publish 127.0.0.1:18080:8080 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            epub-ai-frontend:ci
      - name: Check HTML, SPA routes, and API boundary
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:18080/ --output /tmp/frontend-index.html
          curl --fail --silent --show-error http://127.0.0.1:18080/reader/example \
            --output /tmp/frontend-spa.html
          cmp /tmp/frontend-index.html /tmp/frontend-spa.html
          curl --fail --silent --show-error --head http://127.0.0.1:18080/index.html \
            | rg --ignore-case '^cache-control:.*no-store'
          api_status=$(curl --silent --show-error --max-time 10 \
            --output /tmp/frontend-api.html --write-out '%{http_code}' \
            http://127.0.0.1:18080/api/not-implemented)
          [[ "$api_status" == 502 || "$api_status" == 504 ]]
          ! cmp --silent /tmp/frontend-index.html /tmp/frontend-api.html
          asset_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/assets/not-a-real-file.js)
          test "$asset_status" = 404
      - name: Container logs
        if: failure()
        run: docker logs epub-ai-frontend-ci
      - name: Stop smoke-test container
        if: always()
        run: docker rm --force epub-ai-frontend-ci 2>/dev/null || true
