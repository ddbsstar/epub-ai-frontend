worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker's embedded DNS also allows the backend container to restart.
    # Resolving at request time keeps static pages available before API startup.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 10m;

        set $api_upstream backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        add_header X-Content-Type-Options nosniff always;

        # Preserve /api and its query string; never fall back to the SPA here.
        location = /api {
            proxy_pass http://$api_upstream$request_uri;
            add_header Cache-Control 'no-store' always;
            add_header X-Content-Type-Options nosniff always;
        }

        location ^~ /api/ {
            proxy_pass http://$api_upstream$request_uri;
            add_header Cache-Control 'no-store' always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /index.html {
            add_header Cache-Control 'no-store' always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Vite writes content-hashed build assets to this directory.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control 'public, max-age=31536000, immutable';
            add_header X-Content-Type-Options nosniff always;
        }

        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control 'no-cache' always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
